/* ===== LS helpers (demo) ===== */
const LS={CAT:"orax_cat",PL:"orax_pl",VER:"orax_ver",PR:"orax_pr",TN:"orax_tn",AC:"orax_ac",AL:"orax_al"};
function lsGet(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch{return fb}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

/* ===== Helpers ===== */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slugify=s=>s.toString().toLowerCase().trim().replace(/[^\w\s-]/g,"").replace(/[\s_]+/g,"-").replace(/-+/g,"-");
const fmtDate=ts=>{ if(!ts) return "—"; const d=ts.seconds?new Date(ts.seconds*1000):new Date(ts); return d.toLocaleString(); };
const bumpVersion=(v,t="patch")=>{const m=(v||"v1.0.0").replace("v","").split(".").map(n=>parseInt(n)||0);while(m.length<3)m.push(0);if(t==="major"){m[0]++;m[1]=0;m[2]=0}else if(t==="minor"){m[1]++;m[2]=0}else m[2]++;return "v"+m.join(".")};

async function crudCreate(col,data,lsKey,stateKey,prefix){ if(state.demoMode){ const id=prefix+"-"+Date.now(); lsSet(lsKey,[...state[stateKey],{id,...data}]); return id; } const r=await addDoc(collection(db,col),{...data,createdAt:serverTimestamp(),updatedAt:serverTimestamp()}); return r.id; }
async function crudUpdate(col,id,data,lsKey,stateKey){ if(state.demoMode){ lsSet(lsKey,state[stateKey].map(x=>x.id===id?{...x,...data}:x)); return; } await updateDoc(doc(db,col,id),{...data,updatedAt:serverTimestamp()}); }
async function crudDelete(col,id,lsKey,stateKey){ if(state.demoMode){ lsSet(lsKey,state[stateKey].filter(x=>x.id!==id)); return; } await deleteDoc(doc(db,col,id)); }

const createCategory=(d)=>crudCreate("categories",d,LS.CAT,"categories","cat");

const deleteCategory=(id)=>crudDelete("categories",id,LS.CAT,"categories");
const createPlatform=(d)=>crudCreate("platforms",d,LS.PL,"platforms","pl");

const createVersion=(d)=>crudCreate("platformVersions",d,LS.VER,"versions","ver");

const createProduct=(d)=>crudCreate("products",d,LS.PR,"products","pr");

async function updateUserRole(uid,role){ if(state.demoMode){ lsSet("orax_users",state.users.map(u=>u.id===uid?{...u,role}:u)); return; } await updateDoc(doc(db,"users",uid),{role,updatedAt:serverTimestamp()}); }
async function setAccess(uid,pid,status){ if(state.demoMode){ const next=state.access.filter(a=>!(a.userId===uid&&a.platformId===pid)); if(status)next.push({id:`acc-${uid}-${pid}`,userId:uid,platformId:pid,status}); lsSet(LS.AC,next); return; } const id=`${uid}_${pid}`; if(!status){ await deleteDoc(doc(db,"platformAccess",id)); return; } await setDoc(doc(db,"platformAccess",id),{userId:uid,platformId:pid,status,updatedAt:serverTimestamp()}); }

async function logAction(action,entityType,entityId,metadata={}){ if(state.demoMode) return; try{ await addDoc(collection(db,"auditLogs"),{actorId:state.user?.uid||"system",actorEmail:state.user?.email||"",action,entityType,entityId,metadata,timestamp:serverTimestamp()}); }catch(e){console.warn(e)} }

async function seedCategories(){
  if (!confirm("Load 18 main categories + ~200 subcategories? Existing ones stay.")) return;
  toast("⏳ Loading... please wait");
  try{
    const existing = new Set(state.categories.map(c=>c.name.toLowerCase()));
    let order = state.categories.length;
    for (const main of SEED_CATEGORIES){
      let mainId;
      if (existing.has(main.name.toLowerCase())){
        mainId = state.categories.find(c=>c.name.toLowerCase()===main.name.toLowerCase()).id;
      } else {
        mainId = await createCategory({ name: main.name, icon: main.icon, order: order++, parentId: "" });
        existing.add(main.name.toLowerCase());
      }
      for (const sub of main.subs){
        if (existing.has(sub.toLowerCase())) continue;
        await createCategory({ name: sub, icon: "•", order: order++, parentId: mainId });
        existing.add(sub.toLowerCase());
      }
    }
    await reloadData(); render();
    toast("✅ Categories loaded");
  }catch(e){ toast("❌ "+e.message) }
}

  platSel.addEventListener("change",()=>{const list=state.versions.filter(v=>v.platformId===platSel.value).map(v=>v.versionNumber);verInput.value=bumpVersion(list.sort().reverse()[0]||"v1.0.0","patch")});
  w.querySelector("#bump-patch").onclick=()=>verInput.value=bumpVersion(verInput.value,"patch");
  w.querySelector("#bump-minor").onclick=()=>verInput.value=bumpVersion(verInput.value,"minor");
  w.querySelector("#bump-major").onclick=()=>verInput.value=bumpVersion(verInput.value,"major");
  w.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>w.remove());
  w.querySelector("#saveBtn").onclick=async()=>{
    const platformId=w.querySelector("#v-platformId").value;
    const versionNumber=w.querySelector("#v-versionNumber").value.trim();
    const releaseNotes=w.querySelector("#v-releaseNotes").value.trim();
    const buildRef=w.querySelector("#v-buildRef").value.trim();
    const status=w.querySelector("#v-status").value;
    if(!versionNumber){w.querySelector("#formMsg").className="text-sm text-red-600";w.querySelector("#formMsg").textContent="Version required";return}
    try{
      const data={platformId,versionNumber,releaseNotes,buildRef,status,createdBy:state.user?.email||"system"};
      if(status==="LIVE"){
        const prev=state.versions.filter(v=>v.platformId===platformId&&v.status==="LIVE");
        for(const v of prev) await updateVersion(v.id,{status:"ROLLED_BACK"});
        data.publishedAt=serverTimestamp();
        await updatePlatform(platformId,{currentVersion:versionNumber});
      }
      const nid=await createVersion(data);
      await logAction("VERSION_CREATED","platformVersion",nid,{platformId,versionNumber,status});
      await reloadData();w.remove();render();toast("✅ Version registered");
    }catch(e){toast("❌ "+e.message)}
  };
}

function confirmDelete(msg,onOk){
  document.body.insertAdjacentHTML("beforeend",`<div id="confirmWrap" class="fixed inset-0 modal-bg z-[100] grid place-items-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 relative fade-in">
      <div class="text-5xl mb-3 text-center">⚠️</div>
      <h2 class="text-xl font-bold mb-2 text-center">Are you sure?</h2>
      <p class="text-gray-600 text-sm text-center mb-6">${esc(msg)}</p>
      <div class="flex gap-3"><button data-close class="flex-1 px-5 py-3 rounded-lg border font-semibold">Cancel</button><button id="confirmYes" class="flex-1 px-5 py-3 rounded-lg bg-red-500 text-white font-bold">Yes, Delete</button></div>
    </div></div>`);
  const w=document.getElementById("confirmWrap");
  w.querySelector("[data-close]").onclick=()=>w.remove();
  w.querySelector("#confirmYes").onclick=async()=>{w.remove();await onOk()};
}

function toast(msg){
  const t=document.createElement("div");
  t.className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg z-[200] fade-in text-sm font-semibold";
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
}

function openAuth(mode="login"){
  const e=document.getElementById("authModal");if(e)e.remove();
  document.body.insertAdjacentHTML("beforeend",`<div id="authModal" class="fixed inset-0 modal-bg z-[100] grid place-items-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-8 relative fade-in">
      <button data-close class="absolute top-4 right-4 text-gray-400 text-2xl">×</button>
      <h2 class="text-2xl font-bold mb-1">${mode==="login"?"Welcome Back":"Create Account"}</h2>
      <p class="text-sm text-gray-500 mb-6">Sign in to oraXpress</p>
      <input id="authEmail" type="email" placeholder="Email" class="w-full border rounded-lg px-4 py-3 mb-3 focus:outline-none focus:border-orange-500"/>
      <input id="authPass" type="password" placeholder="Password (6+)" class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:border-orange-500"/>
      <button id="authSubmit" class="w-full bg-orange-500 text-white font-bold py-3 rounded-lg">${mode==="login"?"Sign In":"Register"}</button>
      <div id="authMsg" class="text-sm mt-3 text-center"></div>
    </div></div>`);
  const w=document.getElementById("authModal");
  w.querySelector("[data-close]").onclick=()=>w.remove();
  w.querySelector("#authSubmit").onclick=async()=>{
    const email=w.querySelector("#authEmail").value.trim();
    const pass=w.querySelector("#authPass").value;
    const msg=w.querySelector("#authMsg");
    if(state.demoMode){msg.className="text-sm mt-3 text-center text-orange-600";msg.textContent="Demo Mode";return}
    try{
      if(mode==="login") await signInWithEmailAndPassword(auth,email,pass);
      else await createUserWithEmailAndPassword(auth,email,pass);
      w.remove();toast("✅ Signed in");
    }catch(e){msg.className="text-sm mt-3 text-center text-red-500";msg.textContent=e.message}
  };
}

/* ===== ROUTER ===== */
function render(){
  const root=document.getElementById("app");
  const route=state.route;
  if(route==="/admin"){root.innerHTML=renderAdmin();return}
  if(route.startsWith("/product/")){
    const id=route.replace("/product/","");
    const prod=state.products.find(p=>String(p.id)===id);
    if(prod){root.innerHTML=renderProductPage(prod);return}
  }
  const slug=route.startsWith("/")?route.slice(1):route;
  const platform=state.platforms.find(p=>p.slug===slug);
  if(platform){root.innerHTML=renderPlatformPage(platform);return}
  root.innerHTML=renderHome();
}

async function versionAction(id,newStatus,actionName){
  try{
    const v=state.versions.find(x=>x.id===id);if(!v)return;
    const patch={status:newStatus};
    if(newStatus==="LIVE"){
      const prev=state.versions.filter(x=>x.platformId===v.platformId&&x.status==="LIVE");
      for(const pv of prev) await updateVersion(pv.id,{status:"ROLLED_BACK"});
      patch.publishedAt=serverTimestamp();
      await updatePlatform(v.platformId,{currentVersion:v.versionNumber});
    }
    await updateVersion(id,patch);
    await logAction(actionName,"platformVersion",id,{version:v.versionNumber,status:newStatus});
    await reloadData();render();toast("✅ "+actionName.replace("_"," ").toLowerCase());
  }catch(e){toast("❌ "+e.message)}
}

/* ===== GLOBAL CLICK ===== */
document.addEventListener("click",async(e)=>{
  const t=e.target.closest("[data-action]");
  if(t){
    const a=t.dataset.action;
    if(a==="open-auth") return openAuth("login");
    if(a==="open-auth-register") return openAuth("register");
    if(a==="logout"){if(auth)await signOut(auth);return}
    if(a==="new-platform") return openPlatformModal();
    if(a==="edit-platform"){const p=state.platforms.find(x=>x.id===t.dataset.id);if(p)openPlatformModal(p);return}
    if(a==="delete-platform"){const p=state.platforms.find(x=>x.id===t.dataset.id);if(!p)return;confirmDelete(`Delete platform "${p.name}"?`,async()=>{await deletePlatform(p.id);await logAction("PLATFORM_DELETED","platform",p.id,{name:p.name});await reloadData();render();toast("🗑️ Deleted")});return}
    if(a==="new-product") return openProductModal();
    if(a==="edit-product"){const p=state.products.find(x=>x.id===t.dataset.id);if(p)openProductModal(p);return}
    if(a==="delete-product"){const p=state.products.find(x=>x.id===t.dataset.id);if(!p)return;confirmDelete(`Delete product "${p.name}"?`,async()=>{await deleteProduct(p.id);await logAction("PRODUCT_DELETED","product",p.id,{name:p.name});await reloadData();render();toast("🗑️ Deleted")});return}
    if(a==="seed-categories") return seedCategories();
    if(a==="new-category") return openCategoryModal();
    if(a==="edit-category"){const c=state.categories.find(x=>x.id===t.dataset.id);if(c)openCategoryModal(c);return}
    if(a==="delete-category"){const c=state.categories.find(x=>x.id===t.dataset.id);if(!c)return;confirmDelete(`Delete category "${c.name}"?`,async()=>{await deleteCategory(c.id);await reloadData();render();toast("🗑️ Deleted")});return}
    if(a==="new-version") return openVersionModal();
    if(a==="delete-version"){const v=state.versions.find(x=>x.id===t.dataset.id);if(!v)return;confirmDelete(`Delete version ${v.versionNumber}?`,async()=>{await deleteVersion(v.id);await reloadData();render();toast("🗑️ Deleted")});return}
    if(a==="ver-test") return versionAction(t.dataset.id,"TESTING","VERSION_TESTING");
    if(a==="ver-approve") return versionAction(t.dataset.id,"APPROVED","VERSION_APPROVED");
    if(a==="ver-publish") return versionAction(t.dataset.id,"LIVE","VERSION_PUBLISHED");
    if(a==="ver-rollback") return versionAction(t.dataset.id,"ROLLED_BACK","VERSION_ROLLED_BACK");
    if(a==="new-tenant") return openTenantModal();
    if(a==="edit-tenant"){const tn=state.tenants.find(x=>x.id===t.dataset.id);if(tn)openTenantModal(tn);return}
    if(a==="delete-tenant"){const tn=state.tenants.find(x=>x.id===t.dataset.id);if(!tn)return;confirmDelete(`Delete tenant "${tn.businessName}"?`,async()=>{await deleteTenant(tn.id);await logAction("TENANT_DELETED","tenant",tn.id,{businessName:tn.businessName});await reloadData();render();toast("🗑️ Deleted")});return}
    if(a==="manage-access"){const u=state.users.find(x=>x.id===t.dataset.id);if(u)openAccessModal(u);return}
  }
  const sel=e.target.closest("[data-action='change-role']");
  if(sel){
    try{ await updateUserRole(sel.dataset.id,sel.value); await logAction("USER_ROLE_CHANGED","user",sel.dataset.id,{newRole:sel.value}); await reloadData();render();toast("✅ Role updated"); }catch(err){toast("❌ "+err.message)}
    return;
  }
  const tab=e.target.closest(".admin-tab");
  if(tab){
    document.querySelectorAll(".admin-tab").forEach(b=>{b.classList.remove("border-orange-500","text-orange-600");b.classList.add("border-transparent","text-gray-500")});
    tab.classList.remove("border-transparent","text-gray-500");
    tab.classList.add("border-orange-500","text-orange-600");
    const c=document.getElementById("adminTabContent");if(!c)return;
    if(tab.dataset.tab==="platforms") c.innerHTML=adminTabPlatforms();
    else if(tab.dataset.tab==="products") c.innerHTML=adminTabProducts();
    else if(tab.dataset.tab==="categories") c.innerHTML=adminTabCategories();
    else if(tab.dataset.tab==="versions") c.innerHTML=adminTabVersions();
    else if(tab.dataset.tab==="tenants") c.innerHTML=adminTabTenants();
    else if(tab.dataset.tab==="users") c.innerHTML=adminTabUsers();
    else if(tab.dataset.tab==="audit") c.innerHTML=adminTabAudit();
  }
});

/* ===== DATA LOADER ===== */
async function reloadData(){
  try{
    const [c,p,v,pr,tn,us,ac,al]=await Promise.all([fetchCategories(),fetchPlatforms(),fetchVersions(),fetchProducts(),fetchTenants(),fetchUsers(),fetchAccess(),fetchAuditLogs()]);
    state.categories=c;state.platforms=p;state.versions=v;state.products=pr;state.tenants=tn;state.users=us;state.access=ac;state.auditLogs=al;
  }catch(e){console.warn(e)}
  if(!state.categories.length&&state.demoMode) state.categories=DEMO_CATEGORIES;
  if(!state.platforms.length&&state.demoMode) state.platforms=DEMO_PLATFORMS;
  if(!state.products.length&&state.demoMode) state.products=DEMO_PRODUCTS;
}

/* ===== INIT ===== */
async function init(){
  if(!state.demoMode&&auth){
    onAuthStateChanged(auth,async(u)=>{
      state.user=u;
      if(u){
        try{
          const ref=doc(db,"users",u.uid);
          const snap=await getDoc(ref);
          if(snap.exists()) state.profile=snap.data();
          else{
            const all=await getDocs(collection(db,"users"));
            const isFirst=all.size===0;
            const prof={email:u.email||"",role:isFirst?"SUPER_ADMIN":"USER",createdAt:serverTimestamp()};
            await setDoc(ref,prof);state.profile=prof;
          }
        }catch(e){console.warn(e)}
      } else state.profile=null;
      render();
    });
  }
  await reloadData();
  window.addEventListener("hashchange",()=>{state.route=location.hash.replace("#","")||"/";render()});
  render();
}
init();
</script>
</body>
</html>
