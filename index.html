/* ===== LOCALSTORAGE (Demo mode) ===== */
const LS = { CAT:"orax_cat", PL:"orax_pl", VER:"orax_ver" };
function lsGet(k, fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch{ return fb; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }

/* ===== HELPERS ===== */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slugify = s => s.toString().toLowerCase().trim().replace(/[^\w\s-]/g,"").replace(/[\s_]+/g,"-").replace(/-+/g,"-");
const fmtDate = ts => {
  if (!ts) return "—";
  const d = ts.seconds ? new Date(ts.seconds*1000) : new Date(ts);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
};
const bumpVersion = (v, type="patch") => {
  const m = (v||"v1.0.0").replace("v","").split(".").map(n=>parseInt(n)||0);
  while(m.length<3) m.push(0);
  if (type==="major"){ m[0]++; m[1]=0; m[2]=0; }
  else if (type==="minor"){ m[1]++; m[2]=0; }
  else m[2]++;
  return "v"+m.join(".");
};

/* ===== PLATFORM MODAL ===== */
function openPlatformModal(platform=null){
  const editing = !!platform;
  const p = platform || { name:"", slug:"", desc:"", icon:"🧩", color:"from-orange-500 to-red-500", status:"LIVE", type:"PUBLIC_PRODUCT", categoryId:"" };
  const catOpts = state.categories.map(c=>`<option value="${c.id}" ${p.categoryId===c.id?"selected":""}>${esc(c.name)}</option>`).join("");
  const colors = ["from-orange-500 to-red-500","from-blue-600 to-indigo-600","from-emerald-500 to-teal-600","from-purple-600 to-violet-600","from-pink-500 to-rose-600","from-cyan-500 to-blue-600","from-yellow-500 to-orange-600","from-gray-700 to-gray-900"];

  document.body.insertAdjacentHTML("beforeend", `
  <div id="modalWrap" class="fixed inset-0 modal-bg z-[100] grid place-items-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl w-full max-w-2xl p-6 md:p-8 relative my-8 fade-in">
      <button data-close class="absolute top-4 right-4 text-gray-400 text-2xl">×</button>
      <h2 class="text-2xl font-bold mb-1">${editing?"Edit Platform":"New Platform"}</h2>
      <p class="text-sm text-gray-500 mb-6">${editing?"Update platform details.":"Add a new platform."}</p>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold mb-1">Name *</label>
          <input id="f-name" value="${esc(p.name)}" class="w-full border rounded-lg px-4 py-2.5 focus:outline-none focus:border-orange-500"/>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Slug *</label>
          <input id="f-slug" value="${esc(p.slug)}" class="w-full border rounded-lg px-4 py-2.5 font-mono text-sm focus:outline-none focus:border-orange-500"/>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Category</label>
          <select id="f-categoryId" class="w-full border rounded-lg px-4 py-2.5 focus:outline-none focus:border-orange-500">
            <option value="">— Select —</option>${catOpts}
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold mb-1">Description</label>
          <textarea id="f-desc" rows="3" class="w-full border rounded-lg px-4 py-2.5 focus:outline-none focus:border-orange-500">${esc(p.desc||"")}</textarea>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Icon (emoji)</label>
          <input id="f-icon" value="${esc(p.icon||"🧩")}" maxlength="4" class="w-full border rounded-lg px-4 py-2.5 text-2xl focus:outline-none focus:border-orange-500"/>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Status</label>
          <select id="f-status" class="w-full border rounded-lg px-4 py-2.5 focus:outline-none focus:border-orange-500">
            ${["LIVE","DRAFT","TESTING","SUSPENDED","ARCHIVED"].map(s=>`<option value="${s}" ${p.status===s?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Type</label>
          <select id="f-type" class="w-full border rounded-lg px-4 py-2.5 focus:outline-none focus:border-orange-500">
            <option value="PUBLIC_PRODUCT" ${p.type==="PUBLIC_PRODUCT"?"selected":""}>PUBLIC_PRODUCT</option>
            <option value="PRIVATE_CUSTOM" ${p.type==="PRIVATE_CUSTOM"?"selected":""}>PRIVATE_CUSTOM</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold mb-1">Color Theme</label>
          <div class="flex flex-wrap gap-2">
            ${colors.map(c=>`<button type="button" data-color="${c}" class="color-choice w-11 h-11 rounded-xl bg-gradient-to-br ${c} border-4 ${p.color===c?"border-orange-400":"border-transparent"}"></button>`).join("")}
          </div>
          <input type="hidden" id="f-color" value="${esc(p.color||colors[0])}"/>
        </div>
      </div>
      <div id="formMsg" class="text-sm mt-4"></div>
      <div class="flex justify-end gap-3 mt-6 pt-5 border-t">
        <button data-close class="px-5 py-2.5 rounded-lg border font-semibold">Cancel</button>
        <button id="saveBtn" class="px-5 py-2.5 rounded-lg bg-orange-500 text-white font-bold">${editing?"Save Changes":"Create Platform"}</button>
      </div>
    </div>
  </div>`);
  const wrap = document.getElementById("modalWrap");
  wrap.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>wrap.remove());
  const nameI = wrap.querySelector("#f-name"), slugI = wrap.querySelector("#f-slug");
  nameI.addEventListener("input", ()=>{ if(!editing && !slugI.value) slugI.value = slugify(nameI.value); });
  wrap.querySelectorAll(".color-choice").forEach(btn=>btn.addEventListener("click", ()=>{
    wrap.querySelectorAll(".color-choice").forEach(b=>b.classList.remove("border-orange-400"));
    btn.classList.add("border-orange-400");
    wrap.querySelector("#f-color").value = btn.dataset.color;
  }));
  wrap.querySelector("#saveBtn").onclick = async ()=>{
    const name = wrap.querySelector("#f-name").value.trim();
    const slug = wrap.querySelector("#f-slug").value.trim() || slugify(name);
    const desc = wrap.querySelector("#f-desc").value.trim();
    const icon = wrap.querySelector("#f-icon").value.trim() || "🧩";
    const status = wrap.querySelector("#f-status").value;
    const type = wrap.querySelector("#f-type").value;
    const color = wrap.querySelector("#f-color").value;
    const categoryId = wrap.querySelector("#f-categoryId").value;
    const categoryName = state.categories.find(c=>c.id===categoryId)?.name || "";
    const msg = wrap.querySelector("#formMsg");
    if(!name){ msg.className="text-sm mt-4 text-red-600"; msg.textContent="Name required"; return; }
    if(!slug){ msg.className="text-sm mt-4 text-red-600"; msg.textContent="Slug required"; return; }
    if(state.platforms.some(x=>x.slug===slug && x.id!==p.id)){ msg.className="text-sm mt-4 text-red-600"; msg.textContent="Slug already used"; return; }
    const data = { name, slug, desc, icon, status, type, color, categoryId, categoryName };
    try{
      wrap.querySelector("#saveBtn").disabled = true;
      if(editing){
        await updatePlatform(p.id, data);
        await logAction("PLATFORM_UPDATED","platform",p.id,{name});
      } else {
        const newId = await createPlatform(data);
        // অটো প্রথম ভার্সন v1.0.0 তৈরি
        await createVersion({
          platformId: newId, versionNumber:"v1.0.0",
          releaseNotes:"Initial release", status:"LIVE", buildRef:"",
          createdBy: state.user?.email || "system",
          publishedAt: serverTimestamp()
        });
        await updatePlatform(newId, { currentVersion:"v1.0.0" });
        await logAction("PLATFORM_CREATED","platform",newId,{name});
      }
      await reloadData(); wrap.remove(); render();
      toast("✅ Platform saved");
    }catch(e){ msg.className="text-sm mt-4 text-red-600"; msg.textContent="Error: "+e.message; wrap.querySelector("#saveBtn").disabled=false; }
  };
}

        <option value="DRAFT">DRAFT (এখনো তৈরি হয়নি)</option>
        <option value="TESTING">TESTING (পরীক্ষা চলছে)</option>
        <option value="APPROVED">APPROVED (অনুমোদিত, পাবলিশের জন্য প্রস্তুত)</option>
        <option value="LIVE" selected>LIVE (এখনই চালু হবে)</option>
      </select>

      <div id="formMsg" class="text-sm"></div>

      <div class="flex justify-end gap-3 mt-6 pt-5 border-t">
        <button data-close class="px-5 py-2.5 rounded-lg border font-semibold">Cancel</button>
        <button id="saveBtn" class="px-5 py-2.5 rounded-lg bg-orange-500 text-white font-bold">Register Version</button>
      </div>
    </div>
  </div>`);
  const wrap = document.getElementById("modalWrap");
  const platSel = wrap.querySelector("#v-platformId");
  const verInput = wrap.querySelector("#v-versionNumber");

  function refreshSuggested(){
    const list = state.versions.filter(v=>v.platformId===platSel.value).map(v=>v.versionNumber);
    const latest = list.sort().reverse()[0] || "v1.0.0";
    verInput.value = bumpVersion(latest, "patch");
  }
  platSel.addEventListener("change", refreshSuggested);
  wrap.querySelector("#bump-patch").onclick = ()=> verInput.value = bumpVersion(verInput.value, "patch");
  wrap.querySelector("#bump-minor").onclick = ()=> verInput.value = bumpVersion(verInput.value, "minor");
  wrap.querySelector("#bump-major").onclick = ()=> verInput.value = bumpVersion(verInput.value, "major");
  wrap.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>wrap.remove());

  wrap.querySelector("#saveBtn").onclick = async ()=>{
    const platformId = wrap.querySelector("#v-platformId").value;
    const versionNumber = wrap.querySelector("#v-versionNumber").value.trim();
    const releaseNotes = wrap.querySelector("#v-releaseNotes").value.trim();
    const buildRef = wrap.querySelector("#v-buildRef").value.trim();
    const status = wrap.querySelector("#v-status").value;
    const msg = wrap.querySelector("#formMsg");

    if(!versionNumber){ msg.className="text-sm text-red-600"; msg.textContent="Version number required"; return; }
    if(state.versions.some(v=>v.platformId===platformId && v.versionNumber===versionNumber)){
      msg.className="text-sm text-red-600"; msg.textContent="এই ভার্সন আগেই আছে"; return;
    }

    try{
      wrap.querySelector("#saveBtn").disabled = true;
      const data = {
        platformId, versionNumber, releaseNotes, buildRef, status,
        createdBy: state.user?.email || "system"
      };
      // যদি LIVE হয়, আগের LIVE গুলো ROLLED_BACK করি
      if(status === "LIVE"){
        const prevLive = state.versions.filter(v=>v.platformId===platformId && v.status==="LIVE");
        for(const v of prevLive) await updateVersion(v.id, { status:"ROLLED_BACK" });
        data.publishedAt = serverTimestamp();
        data.publishedBy = state.user?.email || "system";
        // platform-এ currentVersion আপডেট
        await updatePlatform(platformId, { currentVersion: versionNumber });
      }
      const newId = await createVersion(data);
      await logAction("VERSION_CREATED","platformVersion",newId,{platformId, versionNumber, status});
      await reloadData(); wrap.remove(); render();
      toast("✅ Version registered");
    }catch(e){ msg.className="text-sm text-red-600"; msg.textContent="Error: "+e.message; wrap.querySelector("#saveBtn").disabled=false; }
  };
}

/* ===== CONFIRM ===== */
function confirmDelete(message, onConfirm){
  document.body.insertAdjacentHTML("beforeend", `
  <div id="confirmWrap" class="fixed inset-0 modal-bg z-[100] grid place-items-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 relative fade-in">
      <div class="text-5xl mb-3 text-center">⚠️</div>
      <h2 class="text-xl font-bold mb-2 text-center">Are you sure?</h2>
      <p class="text-gray-600 text-sm text-center mb-6">${esc(message)}</p>
      <div class="flex gap-3">
        <button data-close class="flex-1 px-5 py-3 rounded-lg border font-semibold">Cancel</button>
        <button id="confirmYes" class="flex-1 px-5 py-3 rounded-lg bg-red-500 text-white font-bold">Yes, Delete</button>
      </div>
    </div>
  </div>`);
  const wrap = document.getElementById("confirmWrap");
  wrap.querySelector("[data-close]").onclick = ()=>wrap.remove();
  wrap.querySelector("#confirmYes").onclick = async ()=>{ wrap.remove(); await onConfirm(); };
}

/* ===== TOAST ===== */
function toast(msg){
  const t = document.createElement("div");
  t.className = "fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg z-[200] fade-in text-sm font-semibold";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

/* ===== AUTH ===== */
function openAuth(mode="login"){
  const e = document.getElementById("authModal"); if(e) e.remove();
  document.body.insertAdjacentHTML("beforeend", `
  <div id="authModal" class="fixed inset-0 modal-bg z-[100] grid place-items-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-8 relative fade-in">
      <button data-close class="absolute top-4 right-4 text-gray-400 text-2xl">×</button>
      <h2 class="text-2xl font-bold mb-1">${mode==="login"?"Welcome Back":"Create Account"}</h2>
      <p class="text-sm text-gray-500 mb-6">Sign in to oraXpress</p>
      <input id="authEmail" type="email" placeholder="Email" class="w-full border rounded-lg px-4 py-3 mb-3 focus:outline-none focus:border-orange-500"/>
      <input id="authPass" type="password" placeholder="Password (6+ chars)" class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:border-orange-500"/>
      <button id="authSubmit" class="w-full bg-orange-500 text-white font-bold py-3 rounded-lg">${mode==="login"?"Sign In":"Register"}</button>
      <div id="authMsg" class="text-sm mt-3 text-center"></div>
    </div>
  </div>`);
  const wrap = document.getElementById("authModal");
  wrap.querySelector("[data-close]").onclick = ()=>wrap.remove();
  wrap.querySelector("#authSubmit").onclick = async ()=>{
    const email = wrap.querySelector("#authEmail").value.trim();
    const pass = wrap.querySelector("#authPass").value;
    const msg = wrap.querySelector("#authMsg");
    if(state.demoMode){ msg.className="text-sm mt-3 text-center text-orange-600"; msg.textContent="Demo Mode: Firebase config দিন।"; return; }
    try{
      if(mode==="login") await signInWithEmailAndPassword(auth, email, pass);
      else await createUserWithEmailAndPassword(auth, email, pass);
      wrap.remove(); toast("✅ Signed in");
    }catch(err){ msg.className="text-sm mt-3 text-center text-red-500"; msg.textContent=err.message; }
  };
}

/* ===== ROUTER ===== */
function render(){
  const root = document.getElementById("app");
  const route = state.route;
  if (route === "/admin"){ root.innerHTML = renderAdmin(); return; }
  const slug = route.startsWith("/") ? route.slice(1) : route;
  const platform = state.platforms.find(p=>p.slug===slug);
  if (platform){ root.innerHTML = renderPlatformPage(platform); return; }
  root.innerHTML = renderHome();
}

/* ===== VERSION STATUS ACTIONS ===== */
async function versionAction(id, newStatus, actionName){
  try{
    const v = state.versions.find(x=>x.id===id);
    if(!v) return;
    const patch = { status: newStatus };
    if (newStatus === "LIVE"){
      // আগের LIVE গুলো rollback
      const prev = state.versions.filter(x=>x.platformId===v.platformId && x.status==="LIVE");
      for(const pv of prev) await updateVersion(pv.id, { status:"ROLLED_BACK" });
      patch.publishedAt = serverTimestamp();
      patch.publishedBy = state.user?.email || "system";
      await updatePlatform(v.platformId, { currentVersion: v.versionNumber });
    }
    await updateVersion(id, patch);
    await logAction(actionName, "platformVersion", id, { version:v.versionNumber, status:newStatus });
    await reloadData(); render();
    toast("✅ " + actionName.replace("_"," ").toLowerCase());
  }catch(e){ toast("❌ " + e.message); }
}

/* ===== GLOBAL CLICK ===== */
document.addEventListener("click", async (e)=>{
  const t = e.target.closest("[data-action]");
  if (t){
    const a = t.dataset.action;
    if(a==="open-auth") return openAuth("login");
    if(a==="open-auth-register") return openAuth("register");
    if(a==="logout"){ if(auth) await signOut(auth); return; }
    if(a==="new-platform") return openPlatformModal();
    if(a==="edit-platform"){ const p=state.platforms.find(x=>x.id===t.dataset.id); if(p) openPlatformModal(p); return; }
    if(a==="delete-platform"){ const p=state.platforms.find(x=>x.id===t.dataset.id); if(!p) return;
      confirmDelete(`Delete platform "${p.name}"? এর সব version-ও থাকবে (history)` , async ()=>{
        await deletePlatform(p.id); await logAction("PLATFORM_DELETED","platform",p.id,{name:p.name});
        await reloadData(); render(); toast("🗑️ Deleted");
      }); return;
    }
    if(a==="new-category") return openCategoryModal();
    if(a==="edit-category"){ const c=state.categories.find(x=>x.id===t.dataset.id); if(c) openCategoryModal(c); return; }
    if(a==="delete-category"){ const c=state.categories.find(x=>x.id===t.dataset.id); if(!c) return;
      confirmDelete(`Delete category "${c.name}"?`, async ()=>{
        await deleteCategory(c.id); await reloadData(); render(); toast("🗑️ Deleted");
      }); return;
    }
    if(a==="new-version") return openVersionModal();
    if(a==="delete-version"){ const v=state.versions.find(x=>x.id===t.dataset.id); if(!v) return;
      confirmDelete(`Delete version ${v.versionNumber}?`, async ()=>{
        await deleteVersion(v.id); await reloadData(); render(); toast("🗑️ Deleted");
      }); return;
    }
    if(a==="ver-test")     return versionAction(t.dataset.id, "TESTING", "VERSION_TESTING");
    if(a==="ver-approve")  return versionAction(t.dataset.id, "APPROVED", "VERSION_APPROVED");
    if(a==="ver-publish")  return versionAction(t.dataset.id, "LIVE", "VERSION_PUBLISHED");
    if(a==="ver-rollback") return versionAction(t.dataset.id, "ROLLED_BACK", "VERSION_ROLLED_BACK");
  }
  const tab = e.target.closest(".admin-tab");
  if (tab){
    document.querySelectorAll(".admin-tab").forEach(b=>{
      b.classList.remove("border-orange-500","text-orange-600");
      b.classList.add("border-transparent","text-gray-500");
    });
    tab.classList.remove("border-transparent","text-gray-500");
    tab.classList.add("border-orange-500","text-orange-600");
    const c = document.getElementById("adminTabContent");
    if(!c) return;
    if(tab.dataset.tab==="platforms")  c.innerHTML = adminTabPlatforms();
    if(tab.dataset.tab==="categories") c.innerHTML = adminTabCategories();
    if(tab.dataset.tab==="versions")   c.innerHTML = adminTabVersions();
    if(tab.dataset.tab==="audit")      c.innerHTML = adminTabAudit();
  }
});

/* ===== DATA LOADER ===== */
async function reloadData(){
  try{
    const [c,p,v] = await Promise.all([fetchCategories(), fetchPlatforms(), fetchVersions()]);
    state.categories = c; state.platforms = p; state.versions = v;
  }catch(e){ console.warn(e); }
  if(!state.categories.length && state.demoMode) state.categories = DEMO_CATEGORIES;
  if(!state.platforms.length  && state.demoMode) state.platforms  = DEMO_PLATFORMS;
  if(!state.versions.length   && state.demoMode) state.versions   = DEMO_VERSIONS;
  state.products = DEMO_PRODUCTS;
}

/* ===== INIT ===== */
async function init(){
  if(!state.demoMode && auth){
    onAuthStateChanged(auth, async (u)=>{
      state.user = u;
      if(u){
        try{
          const ref = doc(db,"users",u.uid);
          const snap = await getDoc(ref);
          if(snap.exists()) state.profile = snap.data();
          else{
            const all = await getDocs(collection(db,"users"));
            const isFirst = all.size === 0;
            const prof = { email:u.email||"", role: isFirst?"SUPER_ADMIN":"USER", createdAt: serverTimestamp() };
            await setDoc(ref, prof);
            state.profile = prof;
          }
        }catch(e){ console.warn(e); }
      } else state.profile = null;
      render();
    });
  }
  await reloadData();
  window.addEventListener("hashchange", ()=>{
    state.route = location.hash.replace("#","") || "/";
    render();
  });
  render();
}
init();
</script>
