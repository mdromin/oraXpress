/* Demo mode-এ localStorage, real mode-এ Firestore */

const LS_KEY_CAT = "oraxpress_categories";
const LS_KEY_PL  = "oraxpress_platforms";

function loadLS(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function saveLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

async function fetchCategories() {
  if (state.demoMode) return loadLS(LS_KEY_CAT, DEMO_CATEGORIES);
  const snap = await getDocs(query(collection(db, "categories"), orderBy("order", "asc")));
  const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  return list.length ? list : [];
}

async function fetchPlatforms() {
  if (state.demoMode) return loadLS(LS_KEY_PL, DEMO_PLATFORMS);
  const snap = await getDocs(collection(db, "platforms"));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function createCategory(data) {
  if (state.demoMode) {
    const id = "cat-" + Date.now();
    const next = [...state.categories, { id, ...data }];
    saveLS(LS_KEY_CAT, next);
    return id;
  }
  const ref = await addDoc(collection(db, "categories"), { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  return ref.id;
}

async function updateCategory(id, data) {
  if (state.demoMode) {
    const next = state.categories.map(c => c.id === id ? { ...c, ...data } : c);
    saveLS(LS_KEY_CAT, next);
    return;
  }
  await updateDoc(doc(db, "categories", id), { ...data, updatedAt: serverTimestamp() });
}

async function deleteCategory(id) {
  if (state.demoMode) {
    saveLS(LS_KEY_CAT, state.categories.filter(c => c.id !== id));
    return;
  }
  await deleteDoc(doc(db, "categories", id));
}

async function createPlatform(data) {
  if (state.demoMode) {
    const id = "pl-" + Date.now();

async function updatePlatform(id, data) {

/* =======================  HELPERS  ======================= */
function slugify(s) {
  return s.toString().toLowerCase().trim()
    .replace(/[^\w\s-]/g, "").replace(/[\s_]+/g, "-").replace(/-+/g, "-");
}
function uid(prefix="id") { return prefix + "-" + Math.random().toString(36).slice(2,9); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    return `${header()}<div class="max-w-xl mx-auto py-24 text-center">
      <h1 class="text-2xl font-bold mb-4">Admin Login Required</h1>
      <button data-action="open-auth" class="bg-orange-500 text-white font-bold px-6 py-3 rounded-full">Sign In</button>
    </div>`;
  }

  const stats = [
    { label: "Total Platforms", value: state.platforms.length, icon: "🧩", color: "from-blue-500 to-indigo-500" },
    { label: "Live Platforms",  value: state.platforms.filter(p=>p.status==="LIVE").length, icon: "🟢", color: "from-emerald-500 to-teal-500" },
    { label: "Categories",      value: state.categories.length, icon: "📂", color: "from-purple-500 to-pink-500" },
    { label: "Demo Mode",       value: state.demoMode ? "ON" : "OFF", icon: "⚙️", color: "from-orange-500 to-red-500" }
  ];

  return `
  ${header()}
  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <h1 class="text-3xl font-bold">Super Admin Dashboard</h1>
      <div class="text-sm text-gray-500">${state.user ? esc(state.user.email || "") : "Demo Mode"}</div>
    </div>

    ${state.demoMode ? `<div class="bg-yellow-50 border border-yellow-300 text-yellow-800 p-4 rounded-xl mb-6 text-sm">
      ⚠️ Demo Mode চলছে। এখানে যা যোগ/এডিট করবেন সব আপনার ব্রাউজারে (localStorage-এ) সেভ হবে। Firebase বসালে ক্লাউডে সেভ হবে।
    </div>` : ""}

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      ${stats.map(s => `
        <div class="bg-white border rounded-2xl p-5">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${s.color} grid place-items-center text-2xl text-white mb-3">${s.icon}</div>
          <div class="text-3xl font-extrabold">${s.value}</div>
          <div class="text-sm text-gray-500">${s.label}</div>
        </div>
      `).join("")}
    </div>

    <!-- TABS -->
    <div class="flex gap-2 mb-6 border-b border-gray-200 overflow-x-auto">
      <button data-tab="platforms" class="admin-tab px-4 py-3 font-semibold text-sm border-b-2 border-orange-500 text-orange-600 whitespace-nowrap">🧩 Platforms</button>
      <button data-tab="categories" class="admin-tab px-4 py-3 font-semibold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-800 whitespace-nowrap">📂 Categories</button>
      <button data-tab="audit" class="admin-tab px-4 py-3 font-semibold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-800 whitespace-nowrap">📝 Audit Log</button>
    </div>

    <div id="adminTabContent">
      ${adminTabPlatforms()}
    </div>
  </div>
  ${footer()}`;
}

/* =======================  MODALS  ======================= */
function openPlatformModal(platform = null) {
  const editing = !!platform;
  const p = platform || { name: "", slug: "", desc: "", icon: "🧩", color: "from-orange-500 to-red-500", status: "LIVE", type: "PUBLIC_PRODUCT", categoryId: "" };
  const categoryOptions = state.categories.map(c => `<option value="${c.id}" ${p.categoryId === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("");
  const colorOptions = [
    "from-orange-500 to-red-500", "from-blue-600 to-indigo-600", "from-emerald-500 to-teal-600",
    "from-purple-600 to-violet-600", "from-pink-500 to-rose-600", "from-cyan-500 to-blue-600",
    "from-yellow-500 to-orange-600", "from-gray-700 to-gray-900"
  ];

  const html = `
  <div id="modalWrap" class="fixed inset-0 modal-bg z-[100] grid place-items-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl w-full max-w-2xl p-6 md:p-8 relative my-8 fade-in">
      <button data-close class="absolute top-4 right-4 text-gray-400 text-2xl leading-none hover:text-gray-800">×</button>
      <h2 class="text-2xl font-bold mb-1">${editing ? "Edit Platform" : "New Platform"}</h2>
      <p class="text-sm text-gray-500 mb-6">${editing ? "Update the platform details below." : "Add a new platform to oraXpress."}</p>

      <div class="grid md:grid-cols-2 gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold mb-1">Platform Name *</label>
          <input id="f-name" value="${esc(p.name)}" placeholder="e.g. Hisab AI" class="w-full border rounded-lg px-4 py-2.5 focus:outline-none focus:border-orange-500"/>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Slug (URL) *</label>
          <input id="f-slug" value="${esc(p.slug)}" placeholder="e.g. hisabai" class="w-full border rounded-lg px-4 py-2.5 font-mono text-sm focus:outline-none focus:border-orange-500"/>
          <p class="text-[11px] text-gray-500 mt-1">URL হবে: yoursite.com/#/<b id="slugPreview">${esc(p.slug || "slug")}</b></p>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Category</label>
          <select id="f-categoryId" class="w-full border rounded-lg px-4 py-2.5 focus:outline-none focus:border-orange-500">
            <option value="">— Select —</option>
            ${categoryOptions}
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-semibold mb-1">Description</label>
          <textarea id="f-desc" rows="3" placeholder="Short description..." class="w-full border rounded-lg px-4 py-2.5 focus:outline-none focus:border-orange-500">${esc(p.desc || "")}</textarea>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Icon (emoji)</label>
          <input id="f-icon" value="${esc(p.icon || "🧩")}" class="w-full border rounded-lg px-4 py-2.5 text-2xl focus:outline-none focus:border-orange-500" maxlength="4"/>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Status</label>
          <select id="f-status" class="w-full border rounded-lg px-4 py-2.5 focus:outline-none focus:border-orange-500">
            <option value="LIVE" ${p.status === "LIVE" ? "selected" : ""}>LIVE</option>
            <option value="DRAFT" ${p.status === "DRAFT" ? "selected" : ""}>DRAFT</option>
            <option value="TESTING" ${p.status === "TESTING" ? "selected" : ""}>TESTING</option>
            <option value="SUSPENDED" ${p.status === "SUSPENDED" ? "selected" : ""}>SUSPENDED</option>
            <option value="ARCHIVED" ${p.status === "ARCHIVED" ? "selected" : ""}>ARCHIVED</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Type</label>
          <select id="f-type" class="w-full border rounded-lg px-4 py-2.5 focus:outline-none focus:border-orange-500">
            <option value="PUBLIC_PRODUCT" ${p.type === "PUBLIC_PRODUCT" ? "selected" : ""}>PUBLIC_PRODUCT</option>
            <option value="PRIVATE_CUSTOM" ${p.type === "PRIVATE_CUSTOM" ? "selected" : ""}>PRIVATE_CUSTOM</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-semibold mb-1">Color Theme</label>
          <div class="flex flex-wrap gap-2">
            ${colorOptions.map(c => `
              <button type="button" data-color="${c}" class="color-choice w-12 h-12 rounded-xl bg-gradient-to-br ${c} border-4 ${p.color === c ? 'border-orange-400' : 'border-transparent'}"></button>
            `).join("")}
          </div>
          <input type="hidden" id="f-color" value="${esc(p.color || colorOptions[0])}"/>
        </div>
      </div>

      <div id="formMsg" class="text-sm mt-4"></div>

      <div class="flex justify-end gap-3 mt-6 pt-5 border-t">
        <button data-close class="px-5 py-2.5 rounded-lg border font-semibold text-gray-700 hover:bg-gray-50">Cancel</button>
        <button id="savePlatformBtn" class="px-5 py-2.5 rounded-lg bg-orange-500 hover:bg-orange-600 text-white font-bold">
          ${editing ? "Save Changes" : "Create Platform"}
        </button>
      </div>
    </div>
  </div>`;

  document.body.insertAdjacentHTML("beforeend", html);
  const wrap = document.getElementById("modalWrap");

  // Slug auto-preview
  const slugInput = wrap.querySelector("#f-slug");
  const nameInput = wrap.querySelector("#f-name");
  const slugPrev  = wrap.querySelector("#slugPreview");
  nameInput.addEventListener("input", () => {
    if (!editing && !slugInput.value) slugInput.value = slugify(nameInput.value);
    slugPrev.textContent = slugInput.value || "slug";
  });
  slugInput.addEventListener("input", () => { slugPrev.textContent = slugInput.value || "slug"; });

  // Color pick
  wrap.querySelectorAll(".color-choice").forEach(btn => {
    btn.addEventListener("click", () => {
      wrap.querySelectorAll(".color-choice").forEach(b => b.classList.remove("border-orange-400"));
      btn.classList.add("border-orange-400");
      wrap.querySelector("#f-color").value = btn.dataset.color;
    });
  });

  // Close
  wrap.querySelectorAll("[data-close]").forEach(b => b.onclick = () => wrap.remove());

  // Save
  wrap.querySelector("#savePlatformBtn").onclick = async () => {
    const name = wrap.querySelector("#f-name").value.trim();
    const slug = wrap.querySelector("#f-slug").value.trim() || slugify(name);
    const desc = wrap.querySelector("#f-desc").value.trim();
    const icon = wrap.querySelector("#f-icon").value.trim() || "🧩";
    const status = wrap.querySelector("#f-status").value;
    const type = wrap.querySelector("#f-type").value;
    const color = wrap.querySelector("#f-color").value;
    const categoryId = wrap.querySelector("#f-categoryId").value;
    const categoryName = state.categories.find(c => c.id === categoryId)?.name || "";

    const msg = wrap.querySelector("#formMsg");
    if (!name) { msg.className = "text-sm mt-4 text-red-600"; msg.textContent = "Name is required."; return; }
    if (!slug) { msg.className = "text-sm mt-4 text-red-600"; msg.textContent = "Slug is required."; return; }
    // unique slug
    if (state.platforms.some(x => x.slug === slug && x.id !== p.id)) {
      msg.className = "text-sm mt-4 text-red-600"; msg.textContent = "This slug is already used."; return;
    }

    const data = { name, slug, desc, icon, status, type, color, categoryId, categoryName };

    try {
      wrap.querySelector("#savePlatformBtn").disabled = true;
      wrap.querySelector("#savePlatformBtn").textContent = "Saving...";
      if (editing) await updatePlatform(p.id, data);
      else await createPlatform(data);

      await reloadData();
      wrap.remove();
      render();
      toast("✅ Platform saved successfully");
    } catch (e) {
      msg.className = "text-sm mt-4 text-red-600";
      msg.textContent = "Error: " + e.message;
      wrap.querySelector("#savePlatformBtn").disabled = false;
      wrap.querySelector("#savePlatformBtn").textContent = "Save";
    }
  };
}

  const editing = !!cat;
  const c = cat || { name: "", icon: "📦", order: state.categories.length + 1 };

  const html = `
  <div id="modalWrap" class="fixed inset-0 modal-bg z-[100] grid place-items-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 md:p-8 relative fade-in">
      <button data-close class="absolute top-4 right-4 text-gray-400 text-2xl leading-none hover:text-gray-800">×</button>
      <h2 class="text-2xl font-bold mb-1">${editing ? "Edit Category" : "New Category"}</h2>
      <p class="text-sm text-gray-500 mb-6">${editing ? "Update category details." : "Add a new product category."}</p>

      <label class="block text-sm font-semibold mb-1">Name *</label>
      <input id="c-name" value="${esc(c.name)}" placeholder="e.g. Electronics" class="w-full border rounded-lg px-4 py-2.5 mb-4 focus:outline-none focus:border-orange-500"/>

      <label class="block text-sm font-semibold mb-1">Icon (emoji)</label>
      <input id="c-icon" value="${esc(c.icon || "📦")}" maxlength="4" class="w-full border rounded-lg px-4 py-2.5 text-2xl mb-4 focus:outline-none focus:border-orange-500"/>

      <label class="block text-sm font-semibold mb-1">Order (0–999)</label>
      <input id="c-order" type="number" value="${esc(c.order ?? 0)}" class="w-full border rounded-lg px-4 py-2.5 mb-4 focus:outline-none focus:border-orange-500"/>

      <div id="formMsg" class="text-sm"></div>

      <div class="flex justify-end gap-3 mt-6 pt-5 border-t">
        <button data-close class="px-5 py-2.5 rounded-lg border font-semibold text-gray-700 hover:bg-gray-50">Cancel</button>
        <button id="saveCatBtn" class="px-5 py-2.5 rounded-lg bg-orange-500 hover:bg-orange-600 text-white font-bold">
          ${editing ? "Save Changes" : "Create Category"}
        </button>
      </div>
    </div>
  </div>`;

  document.body.insertAdjacentHTML("beforeend", html);
  const wrap = document.getElementById("modalWrap");
  wrap.querySelectorAll("[data-close]").forEach(b => b.onclick = () => wrap.remove());

  wrap.querySelector("#saveCatBtn").onclick = async () => {
    const name = wrap.querySelector("#c-name").value.trim();
    const icon = wrap.querySelector("#c-icon").value.trim() || "📦";
    const order = parseInt(wrap.querySelector("#c-order").value) || 0;
    const msg = wrap.querySelector("#formMsg");

    if (!name) { msg.className = "text-sm text-red-600"; msg.textContent = "Name is required."; return; }

    try {
      if (editing) await updateCategory(c.id, { name, icon, order });
      else await createCategory({ name, icon, order });

      await reloadData();
      wrap.remove();
      render();
      toast("✅ Category saved");
    } catch (e) {
      msg.className = "text-sm text-red-600";
      msg.textContent = "Error: " + e.message;
    }
  };
}

function confirmDelete(message, onConfirm) {
  const html = `
  <div id="confirmWrap" class="fixed inset-0 modal-bg z-[100] grid place-items-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 relative fade-in">
      <div class="text-5xl mb-3 text-center">⚠️</div>
      <h2 class="text-xl font-bold mb-2 text-center">Are you sure?</h2>
      <p class="text-gray-600 text-sm text-center mb-6">${esc(message)}</p>
      <div class="flex gap-3">
        <button data-close class="flex-1 px-5 py-3 rounded-lg border font-semibold text-gray-700 hover:bg-gray-50">Cancel</button>
        <button id="confirmYes" class="flex-1 px-5 py-3 rounded-lg bg-red-500 hover:bg-red-600 text-white font-bold">Yes, Delete</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML("beforeend", html);
  const wrap = document.getElementById("confirmWrap");
  wrap.querySelector("[data-close]").onclick = () => wrap.remove();
  wrap.querySelector("#confirmYes").onclick = async () => {
    wrap.remove();
    await onConfirm();
  };
}

/* =======================  TOAST  ======================= */
function toast(msg) {
  const t = document.createElement("div");
  t.className = "fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg z-[200] fade-in text-sm font-semibold";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

/* =======================  AUTH MODAL  ======================= */
function openAuth(mode = "login") {
  const existing = document.getElementById("authModal");
  if (existing) existing.remove();
  const html = `
  <div id="authModal" class="fixed inset-0 modal-bg z-[100] grid place-items-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-8 relative fade-in">
      <button data-close class="absolute top-4 right-4 text-gray-400 text-2xl">×</button>
      <h2 class="text-2xl font-bold mb-1">${mode === "login" ? "Welcome Back" : "Create Account"}</h2>
      <p class="text-sm text-gray-500 mb-6">Sign in to oraXpress</p>
      <input id="authEmail" type="email" placeholder="Email" class="w-full border rounded-lg px-4 py-3 mb-3 focus:outline-none focus:border-orange-500"/>
      <input id="authPass" type="password" placeholder="Password (6+ chars)" class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:border-orange-500"/>
      <button id="authSubmit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg">
        ${mode === "login" ? "Sign In" : "Register"}
      </button>
      <div id="authMsg" class="text-sm mt-3 text-center"></div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML("beforeend", html);
  const wrap = document.getElementById("authModal");
  wrap.querySelector("[data-close]").onclick = () => wrap.remove();
  wrap.querySelector("#authSubmit").onclick = async () => {
    const email = wrap.querySelector("#authEmail").value.trim();
    const pass = wrap.querySelector("#authPass").value;
    const msg = wrap.querySelector("#authMsg");
    if (state.demoMode) {
      msg.className = "text-sm mt-3 text-center text-orange-600";
      msg.textContent = "Demo Mode: Firebase configure করলে login কাজ করবে।";
      return;
    }
    try {
      if (mode === "login") await signInWithEmailAndPassword(auth, email, pass);
      else await createUserWithEmailAndPassword(auth, email, pass);
      wrap.remove();
      toast("✅ Signed in");
    } catch (e) {
      msg.className = "text-sm mt-3 text-center text-red-500";
      msg.textContent = e.message;
    }
  };
}

/* =======================  ROUTER  ======================= */
function render() {
  const root = document.getElementById("app");
  const route = state.route;

  if (route === "/admin") { root.innerHTML = renderAdmin(); return; }

  const slug = route.startsWith("/") ? route.slice(1) : route;
  const platform = state.platforms.find(p => p.slug === slug);
  if (platform) { root.innerHTML = renderPlatformPage(platform); return; }

  root.innerHTML = renderHome();
}

/* =======================  GLOBAL EVENTS  ======================= */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-action]");
  if (t) {
    const a = t.dataset.action;
    if (a === "open-auth") return openAuth("login");
    if (a === "open-auth-register") return openAuth("register");
    if (a === "logout") { if (auth) await signOut(auth); return; }
    if (a === "go-admin") { location.hash = "/admin"; return; }
    if (a === "new-platform") return openPlatformModal();
    if (a === "edit-platform") {
      const p = state.platforms.find(x => x.id === t.dataset.id);
      if (p) openPlatformModal(p);
      return;
    }
    if (a === "delete-platform") {
      const p = state.platforms.find(x => x.id === t.dataset.id);
      if (!p) return;
      confirmDelete(`Delete platform "${p.name}"? This cannot be undone.`, async () => {
        await deletePlatform(p.id);
        await reloadData();
        render();
        toast("🗑️ Platform deleted");
      });
      return;
    }
    if (a === "new-category") return openCategoryModal();
    if (a === "edit-category") {
      const c = state.categories.find(x => x.id === t.dataset.id);
      if (c) openCategoryModal(c);
      return;
    }
    if (a === "delete-category") {
      const c = state.categories.find(x => x.id === t.dataset.id);
      if (!c) return;
      confirmDelete(`Delete category "${c.name}"?`, async () => {
        await deleteCategory(c.id);
        await reloadData();
        render();
        toast("🗑️ Category deleted");
      });
      return;
    }
  }

  // Admin tabs
  const tab = e.target.closest(".admin-tab");
  if (tab) {
    document.querySelectorAll(".admin-tab").forEach(b => {
      b.classList.remove("border-orange-500", "text-orange-600");
      b.classList.add("border-transparent", "text-gray-500");
    });
    tab.classList.remove("border-transparent", "text-gray-500");
    tab.classList.add("border-orange-500", "text-orange-600");

    const content = document.getElementById("adminTabContent");
    if (!content) return;
    if (tab.dataset.tab === "platforms") content.innerHTML = adminTabPlatforms();
    if (tab.dataset.tab === "categories") content.innerHTML = adminTabCategories();
    if (tab.dataset.tab === "audit") content.innerHTML = adminTabAudit();
  }
});

/* =======================  DATA LOADER  ======================= */
async function reloadData() {
  try {
    const [cats, plats] = await Promise.all([fetchCategories(), fetchPlatforms()]);
    state.categories = cats;
    state.platforms = plats;
  } catch (e) {
    console.warn("Reload error:", e);
  }
  if (!state.categories.length && state.demoMode) state.categories = DEMO_CATEGORIES;
  if (!state.platforms.length && state.demoMode)  state.platforms  = DEMO_PLATFORMS;
  state.products = DEMO_PRODUCTS;
}

/* =======================  INIT  ======================= */
async function init() {
  if (!state.demoMode && auth) {
    onAuthStateChanged(auth, async (u) => {
  state.user = u;
  if (u) {
    try {
      const userRef = doc(db, "users", u.uid);
      const snap = await getDoc(userRef);
      if (snap.exists()) {
        state.profile = snap.data();
      } else {
        // চেক করুন এটা কি প্রথম ইউজার?
        const allUsers = await getDocs(collection(db, "users"));
        const isFirst = allUsers.size === 0;
        const newProfile = {
          email: u.email || "",
          role: isFirst ? "SUPER_ADMIN" : "USER",
          createdAt: serverTimestamp()
        };
        await setDoc(userRef, newProfile);
        state.profile = newProfile;
      }
    } catch (e) { console.warn(e); }
  } else state.profile = null;
  render();
});
  }

  await reloadData();

  window.addEventListener("hashchange", () => {
    state.route = location.hash.replace("#", "") || "/";
    render();
  });

  render();
}
init();
</script>
