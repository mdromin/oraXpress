    <div class="bg-white border rounded-2xl p-6 mt-6">
      <h2 class="font-bold text-lg mb-2">📝 Audit Log</h2>
      <p class="text-sm text-gray-500">Firebase connect করলে এখানে সব action-এর লগ দেখাবে।</p>
    </div>
  </div>
  ${footer()}`;
}

/* =======================  ROUTER  ======================= */
function render() {
  const root = document.getElementById("app");
  const route = state.route;

  if (route === "/admin") { root.innerHTML = renderAdmin(); return; }

  const slug = route.startsWith("/") ? route.slice(1) : route;
  const platform = state.platforms.find(p => p.slug === slug);
  if (platform) { root.innerHTML = renderPlatformPage(platform); return; }

  root.innerHTML = renderHome();
}

/* =======================  AUTH MODAL  ======================= */
function openAuth(mode = "login") {
  const existing = document.getElementById("authModal");
  if (existing) existing.remove();

  const modal = document.createElement("div");
  modal.id = "authModal";
  modal.className = "fixed inset-0 bg-black/60 z-[100] grid place-items-center p-4";
  modal.innerHTML = `
    <div class="bg-white rounded-2xl w-full max-w-md p-8 relative">
      <button data-close class="absolute top-4 right-4 text-gray-400 text-2xl leading-none">×</button>
      <h2 class="text-2xl font-bold mb-1">${mode === "login" ? "Welcome Back" : "Create Account"}</h2>
      <p class="text-sm text-gray-500 mb-6">Sign in to oraXpress</p>
      <input id="authEmail" type="email" placeholder="Email" class="w-full border rounded-lg px-4 py-3 mb-3 focus:outline-none focus:border-orange-500"/>
      <input id="authPass" type="password" placeholder="Password" class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:border-orange-500"/>
      <button id="authSubmit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg">
        ${mode === "login" ? "Sign In" : "Register"}
      </button>
      <div id="authMsg" class="text-sm mt-3 text-center"></div>
    </div>`;
  document.body.appendChild(modal);

  modal.querySelector("[data-close]").onclick = () => modal.remove();
  modal.querySelector("#authSubmit").onclick = async () => {
    const email = modal.querySelector("#authEmail").value;
    const pass = modal.querySelector("#authPass").value;
    const msg = modal.querySelector("#authMsg");

    if (state.demoMode) {
      msg.className = "text-sm mt-3 text-center text-orange-600";
      msg.textContent = "Demo Mode: Firebase configure করুন (README দেখুন)।";
      return;
    }
    try {
      if (mode === "login") await signInWithEmailAndPassword(auth, email, pass);
      else await createUserWithEmailAndPassword(auth, email, pass);
      modal.remove();
    } catch (e) {
      msg.className = "text-sm mt-3 text-center text-red-500";
      msg.textContent = e.message;
    }
  };
}

/* =======================  GLOBAL CLICK HANDLERS  ======================= */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const a = t.dataset.action;
  if (a === "open-auth") openAuth("login");
  else if (a === "open-auth-register") openAuth("register");
  else if (a === "logout") { if (auth) signOut(auth); }
  else if (a === "go-admin") { location.hash = "/admin"; }
});

/* =======================  INIT  ======================= */
async function init() {
  if (!state.demoMode && auth) {
    onAuthStateChanged(auth, async (u) => {
      state.user = u;
      if (u) {
        try {
          const snap = await getDoc(doc(db, "users", u.uid));
          state.profile = snap.exists() ? snap.data() : null;
        } catch (e) { console.warn(e); }
      } else state.profile = null;
      render();
    });
  }

  try {
    if (!state.demoMode) {
      const catSnap = await getDocs(collection(db, "categories"));
      state.categories = catSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const plSnap = await getDocs(collection(db, "platforms"));
      state.platforms = plSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
  } catch (e) { console.warn("Firestore load:", e); }

  if (!state.categories.length) state.categories = DEMO_CATEGORIES;
  if (!state.platforms.length)  state.platforms  = DEMO_PLATFORMS;
  state.products = DEMO_PRODUCTS;

  window.addEventListener("hashchange", () => {
    state.route = location.hash.replace("#", "") || "/";
    render();
  });

  render();
}
init();
</script>
